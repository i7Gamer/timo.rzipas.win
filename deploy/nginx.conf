# Language negotiation at identical URLs: an explicit `lang` cookie wins,
# otherwise the Accept-Language header decides, default is English.
# The cookie name must match LANG_COOKIE_NAME in src/i18n/cookie.ts.
map $http_accept_language $lang_accept {
    default "en";
    "~*^de" "de";
}

map $cookie_lang $lang {
    default $lang_accept;
    "en"    "en";
    "de"    "de";
}

# The health endpoint speaks the visitor's language too — it is quoted
# verbatim in the hero terminal, so the joke has to hold up to curl.
map $lang $healthz_body {
    default "ok — served from the living room";
    "de"    "ok — ausgeliefert aus dem Wohnzimmer";
}

map $uri $cache_control {
    default      "no-cache";
    "~^/_astro/" "public, max-age=31536000, immutable";
    "~*\.(svg|png|ico|txt|xml|woff2?)$" "public, max-age=86400";
}

# Only the HTML differs per language. Hashed assets and the public/ files
# are the same bytes in every tree, and a `Vary: Cookie` on them makes
# browsers refetch fonts and CSS after every language switch. nginx adds no
# header for an empty value.
map $uri $vary {
    default      "Cookie, Accept-Language";
    "~^/_astro/" "";
    "~*\.(svg|png|ico|txt|xml|woff2?)$" "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/$lang;
    index index.html;

    # TLS ends at the Cloudflare edge, so nginx only ever sees plain HTTP and
    # would build its directory redirects (/projects -> /projects/) as
    # http://timo.rzipas.win/..., sending every visitor through a plaintext
    # hop that Cloudflare then bounces back to HTTPS. A relative Location
    # keeps whichever scheme the visitor arrived on.
    absolute_redirect off;

    # Cloudflare replaces the Server header publicly; on the LAN the container
    # answers directly, and the version is nobody's business.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # The headers every response carries live in one snippet (shipped by the
    # Dockerfile) — see the note there on why each location that sets a
    # header of its own has to include it again.
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control $cache_control always;
    # Cloudflare honours only `Vary: Accept-Encoding` and ignores this one, so
    # HTML must stay uncacheable at the edge (see $cache_control above). Turning
    # on "Cache Everything" would serve one language to everybody.
    add_header Vary $vary always;

    error_page 404 /404.html;

    location = /healthz {
        default_type text/plain;
        charset utf-8;
        # Hit every minute by the image's HEALTHCHECK and by the host's
        # status probe — not traffic worth a log line.
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        add_header Vary "Cookie, Accept-Language";
        return 200 $healthz_body;
    }

    # Written by deploy/update-status.ps1 on the host and mounted read-only
    # into the container. Missing file -> 404 -> the homelab page keeps its
    # static build-time labels. The file itself is language-independent, so
    # no Vary here.
    location = /status.json {
        alias /usr/share/nginx/status/status.json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
