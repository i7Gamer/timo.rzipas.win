# Headers every response carries, whichever block produces it.
#
# nginx inherits add_header only into blocks that declare none of their own,
# so a location that sets a single header silently drops all server-level
# ones. This snippet is therefore included by the server block AND by every
# location that adds a header of its own (src/deploy.test.ts enforces it).
# `always` keeps the headers on error pages and redirects too.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
# One year. TLS ends at the Cloudflare edge, which already forces HTTPS and
# forwards this header from the origin unchanged. Browsers ignore HSTS on
# plain-HTTP responses, so reaching the container directly over the LAN keeps
# working. Scope is timo.rzipas.win and hosts below it only — the sibling
# services on rzipas.win are unaffected.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
