# Example homelab deployment. Copy next to your other stacks and adjust.
services:
  website:
    image: ghcr.io/i7gamer/timo.rzipas.win:latest
    container_name: timo-website
    restart: unless-stopped
    ports:
      # Host port for cloudflared (or a reverse proxy) to point at; drop this
      # block if the proxy shares a Docker network with the container instead
      # — but note that deploy/update-status.ps1 probes this port for the
      # site's own status dot, so point its check somewhere else first.
      - '8093:80'
    # The image carries its own HEALTHCHECK (GET /healthz once a minute, see
    # the Dockerfile), so `docker ps` reports health without any block here.
    # Add a healthcheck block only to override those settings.
    volumes:
      # status.json written by deploy/update-status.ps1 (scheduled on the
      # host) — served at /status.json for the live homelab indicators.
      - ./status:/usr/share/nginx/status:ro
