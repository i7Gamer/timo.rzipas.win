name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      # corepack (bundled with Node) installs the pnpm pinned in
      # package.json's packageManager field — the same way the Dockerfile
      # does. pnpm/action-setup went through npm instead and took one to
      # four minutes per run.
      - run: corepack enable
      - run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # Builds the image for the runner's own platform and exercises what the
  # unit tests cannot see: nginx's language negotiation, redirects, the
  # headers on every kind of response and the health check baked into the
  # image. The build cache is shared with the publish job below, which then
  # only has to assemble the nginx stage per architecture.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: timo.rzipas.win:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A short health interval so the healthy state arrives within seconds.
      - run: docker run -d --name smoke --health-interval=2s -p 127.0.0.1:8080:80 timo.rzipas.win:smoke
      - run: bash deploy/smoke-test.sh http://127.0.0.1:8080 smoke
      - if: failure()
        run: docker logs smoke

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PUBLIC_BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/i7gamer/timo.rzipas.win:latest
            ghcr.io/i7gamer/timo.rzipas.win:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
